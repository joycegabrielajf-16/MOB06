<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Cliente</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 30px;
        }

        .formulario {
            width: 300px;
            margin: auto;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
        }

        input[type="text"],
        select {
            width: 90%;
            padding: 8px;
            margin: 8px 0;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #resultado {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="formulario">
        <h2>Cadastro de Cliente</h2>

        <input type="text" id="nome" placeholder="Digite seu nome">

        <label>Cidade:</label>
        <select id="cidade">
            <option value="Belo Horizonte">Belo Horizonte</option>
            <option value="Juiz de Fora">Juiz de Fora</option>
            <option value="Viçosa">Viçosa</option>
            <option value="Barbacena">Barbacena</option>
             <option value="Ubá">Ubá</option>
        </select>

        <p>Tipo de cliente:</p>

        <input type="radio" name="tipo" value="Novo" checked>
        <label>Novo</label>

        <input type="radio" name="tipo" value="Cliente">
        <label>Cliente</label>

        <br><br>

        <button onclick="cadastrar()">Cadastrar</button>

        <p id="resultado"></p>
    </div>

    <script>
        function cadastrar() {
            let nome = document.getElementById("nome").value;
            let cidade = document.getElementById("cidade").value;

            let tipo = document.querySelector('input[name="tipo"]:checked').value;

            document.getElementById("resultado").innerText =
                "Nome: " + nome +
                " | Cidade: " + cidade +
                " | Tipo de cliente: " + tipo;
        }
    </script>

</body>
</html>
