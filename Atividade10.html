<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tema Claro / Escuro</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            color: #222;
            text-align: center;
            padding: 50px;
            transition: 0.3s;
        }

        .card {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 400px;
            margin: auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        button {
            padding: 12px 20px;
            margin: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        /* Tema escuro */
        body.escuro {
            background-color: #121212;
            color: white;
        }

        body.escuro .card {
            background-color: #242424;
            color: white;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>🎨Tema da Página</h1>

        <p id="saida">☀️Tema atual: Claro</p>

        <button onclick="temaClaro()">☀️Tema Claro</button>
        <button onclick="temaEscuro()">🌙Tema Escuro</button>
    </div>

    <script>
        function temaClaro() {
            document.body.className = "";
            document.getElementById("saida").textContent =
                "☀️Tema atual: Claro";
        }

        function temaEscuro() {
            document.body.className = "escuro";
            document.getElementById("saida").textContent =
                "🌙Tema atual: Escuro";
        }
    </script>

</body>
</html>
