<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>🖼️Carrossel de Imagens</title>

    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
        }

        #imagem {
            width: 400px;
            height: 250px;
            object-fit: cover;
            border-radius: 15px;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1>🖼️Galeria</h1>
    <h2 id="titulo">🐾Animais</h2>

    <img id="imagem" src="istockphoto-1296353202-612x612.jpg">

    <br>

    <button onclick="anterior()">Anterior⬅️</button>
    <button onclick="proximo()">Próximo➡️</button>

    <script>
        let numero = 1;

        function atualizarImagem() {

            if (numero == 1) {
                document.getElementById("imagem").src =
                    "istockphoto-1296353202-612x612.jpg";
                document.getElementById("titulo").innerHTML =
                    "🐾Animais";

            } else if (numero == 2) {
                document.getElementById("imagem").src =
                    "pexels-matus-burian-6692972-6720668.jpg";
                document.getElementById("titulo").innerHTML =
                    "🚗Carro";

            } else {
                document.getElementById("imagem").src =
                    "pexels-maceo-di-maria-398668869-28211273.jpg";
                document.getElementById("titulo").innerHTML =
                    "🗼Torre Eiffel";
            }
        }

        function proximo() {
            numero++;

            if (numero > 3) {
                numero = 1;
            }

            atualizarImagem();
        }

        function anterior() {
            numero--;

            if (numero < 1) {
                numero = 3;
            }

            atualizarImagem();
        }
    </script>

</body>
</html>
