<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho de Compras</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 300px;
        }

        input {
            width: 80px;
            padding: 10px;
            margin: 10px;
            text-align: center;
        }

        #total {
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>Carrinho de Compras</h2>

        <p>Fones de ouvido: R$ 29,00 cada</p>

        <label for="quantidade">Quantidade:</label>
        <input
            type="number"
            id="quantidade"
            min="0"
            max="10"
            value="0"
            onchange="calcularTotal()"
        >

        <p id="total">Total: R$ 0,00</p>
    </div>

    <script>
        function calcularTotal() {
            let qtd = Number(document.getElementById("quantidade").value);
            let preco = 29;

            let total = preco * qtd;

            let totalFormatado = total.toFixed(2).replace('.', ',');

            document.getElementById("total").innerText =
                "Total: R$ " + totalFormatado;
        }
    </script>

</body>
</html>
