<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identificação</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 300px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin-bottom: 15px;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }

        #saida {
            color: blue;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>Identificação</h2>

        <input type="text" id="nome" placeholder="Digite seu nome">

        <br>

        <button onclick="mensagem()">Testar</button>
        <button onclick="limpar()">Limpar</button>

        <p id="saida"></p>
    </div>

    <script>
        function mensagem() {
            let nome = document.getElementById("nome").value;
            document.getElementById("saida").innerText = nome;
        }

        function limpar() {
            document.getElementById("nome").value = "";
            mensagem();
        }
    </script>

</body>
</html>
